マイクラの中で使えるスマートフォン。メッセージ・つぶやき・お知らせ・フレンドとレーダー・時計と天気・メモなど。
シンプルボイスチャット・Lightman's Currency・jsn-Craft が入っていれば、電話・銀行・jsn-Craft アプリも使える。
'''

[[dependencies.jsn_phone]]
